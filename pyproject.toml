[project]
name = "my-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Levi-Magny", email = "lemmagny@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.86",
    "chroma>=0.2.0",
    "docling>=2.126.0",
    "docling-parse>=7.18.0",
    "docx2txt>=0.9",
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-aws>=1.7.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-postgres>=0.0.12",
    "pgvector>=0.3.6",
    "langchain-docling>=3.0.0",
    "langchain-protocol>=0.0.19",
    "pypdf>=6.16.2",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "pypdfium2>=5.13.0",
    "sqlalchemy>=2.0.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
my-agent = "my_agent:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
